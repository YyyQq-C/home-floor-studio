name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build release package
        run: npm run package:release

      - name: Save package as workflow artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: home-floor-studio-${{ github.sha }}
          path: |
            releases/home-floor-studio-*.zip
            releases/home-floor-studio-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
